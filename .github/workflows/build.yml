name: Build
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Decode textures
        run: |
          mkdir -p src/main/resources/assets/satlink/textures/block
          mkdir -p src/main/resources/assets/satlink/textures/item
          python3 << 'PY'
          import base64, pathlib
          textures = {
            "block/dish_side.png": "iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAP0lEQVR42mPQ0DL4TwlmABGW1vb/zS1t/1tY2ZHEhhtAjmYQG24ATMLNw4+gZmQ1g9ALpBo06oXRhITiBUowAA+gpQFCyoG0AAAAAElFTkSuQmCC",
            "block/dish_top.png": "iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAZUlEQVR42mNQVtX6TwlmwCZo7+iCFRM0AKbQzsEZK8ZmEAMuzei24zIExQB0jdgMg/FRDEBXjM8LyGwMA9BtwWYzuiswDEC2ISo+E4yxuZB2BlDkBbIDkeJopEpCojgpUyUzkYMBnxKmRJubSKEAAAAASUVORK5CYII=",
            "block/station_side.png": "iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAQUlEQVR42mMwMDH4TwlmoNgADR2N/07u9v8d3exIpkF6B6EBGlvc/ssZKeOkh4ABAxuIcgpyRGHaGTAwYTDguREAztWqAqsDOFQAAAAASUVORK5CYII=",
            "block/station_top.png": "iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAATUlEQVR42mPQNdL9TwlmABEuPk5kYbgBrr7OZGG4Ac7ejmRh2nkhKj4FKybaCyDFkjJyKBgkRrQXcBlAkhewGUBfL2DDIykhkewFSjAASEi+vqzYmf0AAAAASUVORK5CYII=",
            "item/data_chip.png": "iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAa0lEQVR42t3RKQ6AQBBEUU6CwdRxOA5I9l2ybx7N/QqF7TQkEEIlnVH/mTGM/8y0wCv3HACvJvyGCFoi7IioJ+KBSEYinRSAECObFYAQI18UgBCjWBWAEMMpFYAQw61e+MbbwLl9s6l5v7MDXlDf2hoTtlEAAAAASUVORK5CYII=",
            "item/telemetry_pad.png": "iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAbUlEQVR42s2SOQ6AMAwE85KtERWioeGx3DdU+Z/Z9MQygiIrTTnT2M4ls7Kq5Q2PAUxeMJOFrGQjOznISS7SeCVgkNFqAYOMTgsYZPRawCBj0AIGGaMWMMjhUvGAQQ6XigY+PdJvy/JCNFxyuwHX0BNMgLuVCwAAAABJRU5ErkJggg==",
          }
          base = pathlib.Path("src/main/resources/assets/satlink/textures")
          for name, b64s in textures.items():
              path = base / name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(b64s.strip()))
              print("wrote", name, path.stat().st_size)
          PY
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Build
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: sputnik-link-jar
          path: build/libs/*.jar
