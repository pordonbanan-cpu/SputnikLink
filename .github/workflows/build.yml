name: Build
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Decode textures
        run: |
          mkdir -p src/main/resources/assets/satlink/textures/block
          python3 << 'PY'
          import base64, pathlib
          textures = {
            "dish_side.png": "",
            "dish_top.png": "",
            "energy_storage_side.png": "",
            "energy_storage_top.png": "",
            "solar_panel.png": "",
            "station_side.png": "",
            "station_top.png": "",
          }
          base = pathlib.Path("src/main/resources/assets/satlink/textures/block")
          base.mkdir(parents=True, exist_ok=True)
          for name, b64s in textures.items():
              path = base / name
              path.write_bytes(base64.b64decode(b64s.strip()))
              print("wrote", name, path.stat().st_size)
          PY
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Build
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: satlink-0.3.0
          path: build/libs/*.jar
